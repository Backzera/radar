# Site completo para {{HOST}}, caso o domínio ainda não tenha configuração no nginx.
# Copie para /etc/nginx/sites-available/{{HOST}} e ative (veja LEIA-ME.md).
server {
    listen 80;
    listen [::]:80;
    server_name {{HOST}} www.{{HOST}};

    location ^~ {{BASE}} {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        proxy_read_timeout 60s;
    }

    # A raiz do domínio leva para o app enquanto não houver outro site nela.
    location = / {
        return 302 {{BASE}};
    }
}

